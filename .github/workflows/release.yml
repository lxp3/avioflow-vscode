name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build VSIX
        run: npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: echo "path=$(find . -maxdepth 1 -name '*.vsix' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: avioflow-vscode
          path: ${{ steps.vsix.outputs.path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}

      - name: Publish Open VSX
        run: npx ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OPENVSX_TOKEN"
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

      - name: Publish VS Code Marketplace
        run: npx vsce publish --packagePath "${{ steps.vsix.outputs.path }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
