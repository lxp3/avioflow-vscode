name: Build and Publish Extension

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build extension
        env:
          FORCE_FETCH_WASM: "1"
        run: npm run build

      - name: Package VSIX
        run: npx --no-install vsce package --no-dependencies --out "avioflow-${GITHUB_REF_NAME}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: avioflow-${{ github.ref_name }}
          path: avioflow-${{ github.ref_name }}.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "avioflow-${GITHUB_REF_NAME}.vsix"

      - name: Publish to Open VSX Registry
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: npx --yes ovsx@0.10.4 publish "avioflow-${GITHUB_REF_NAME}.vsix" --pat "$OPENVSX_TOKEN"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: avioflow-${{ github.ref_name }}.vsix
          generate_release_notes: true
